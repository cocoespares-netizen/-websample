{% extends "base.html" %}
{% block title %}{% if product %}Edit Product{% else %}Add Product{% endif %} | Gameplan Apparel{% endblock %}
{% block content %}
<section class="page-wrap product-admin-form">
  <form class="form-panel" method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="eyebrow">STORE ADMIN</p><h1>{% if product %}Edit product{% else %}Add a product{% endif %}</h1>
    <label class="product-image-field">Product image
      <span class="product-image-upload-box">
        <img id="product-image-preview" src="{{ product.image_url if product else '' }}" alt="Product image preview"{% if not product or not product.image_url %} hidden{% endif %}>
        <span id="product-image-placeholder"{% if product and product.image_url %} hidden{% endif %}>
          <strong>Choose a product image</strong>
          <small>JPG, PNG, or WebP · up to 8 MB</small>
        </span>
        <input id="product-image-input" name="image" type="file" accept="image/jpeg,image/png,image/webp"{% if not product or not product.image_url %} required{% endif %}>
      </span>
      <small id="product-image-filename">{% if product and product.image_url %}Choose a new image to replace the current one.{% endif %}</small>
    </label>
    <label>Name<input name="name" required maxlength="150" value="{{ request.form.get('name', product.name if product else '') }}"></label>
    <label>URL slug<input name="slug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" value="{{ request.form.get('slug', product.slug if product else '') }}"></label>
    <label>Description<textarea name="description" rows="4" maxlength="2000">{{ request.form.get('description', product.description if product else '') }}</textarea></label>
    <label>Category<input name="category" required maxlength="50" value="{{ request.form.get('category', product.category if product else '') }}"></label>
    <div class="form-grid"><label>Price (PHP)<input name="price" type="number" min="0.01" step="0.01" required value="{{ request.form.get('price', product.price if product else '') }}"></label><label>Stock<input name="stock" type="number" min="0" step="1" required value="{{ request.form.get('stock', product.stock if product else '0') }}"></label></div>
    <label class="checkbox-label"><input type="checkbox" name="featured" {% if request.form.get('featured') or (product and product.featured) %}checked{% endif %}> Feature this product</label>
    <button class="button button-light button-full" type="submit">Save product</button>
    <a class="form-switch" href="{{ url_for('admin_products') }}">Cancel</a>
  </form>
</section>
{% endblock %}
